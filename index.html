<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Essences</title>
    <meta name="description" content="Essences — a calm calendar for the plans that matter. Schedule events, get reminders, and keep your day in focus." />
    <meta name="author" content="Essences" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Essences" />
    <meta property="og:description" content="A calm calendar for the plans that matter." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Essences" />
    <meta name="twitter:description" content="A calm calendar for the plans that matter." />
    <style>
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #faf8f5;
        transition: opacity 0.35s ease;
        pointer-events: none;
      }
      #boot-splash.boot-splash-hide {
        opacity: 0;
      }
      #boot-splash .boot-logo {
        width: 76px;
        height: 76px;
        object-fit: contain;
      }
      #boot-splash .boot-brand {
        position: absolute;
        left: 0;
        right: 0;
        bottom: calc(28px + env(safe-area-inset-bottom, 0px));
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
      }
      #boot-splash .boot-from {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 13px;
        font-weight: 400;
        color: #8c8c8c;
        letter-spacing: 0.01em;
      }
      #boot-splash .boot-confast {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 20px;
        font-weight: 600;
        color: #ea863e;
        letter-spacing: -0.01em;
      }
    </style>
  </head>
  <body>
    <div id="boot-splash" aria-hidden="true">
      <img class="boot-logo" src="/splash-logo.png" alt="" width="76" height="76" />
      <div class="boot-brand">
        <p class="boot-from">from</p>
        <p class="boot-confast" id="boot-confast">Confast</p>
      </div>
    </div>
    <script>
      (function () {
        var hex = {
          orange: "#EA863E",
          coral: "#EF5D39",
          amber: "#F2A60D",
          lime: "#67AE29",
          teal: "#259D91",
          sky: "#2095E9",
          violet: "#804BDD",
          rose: "#DF3A76",
        };
        try {
          var id = localStorage.getItem("essences-theme-accent");
          if (id && hex[id]) {
            var el = document.getElementById("boot-confast");
            if (el) el.style.color = hex[id];
          }
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
