<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Essences</title>
    <meta name="description" content="Essences — a calm calendar for the plans that matter. Schedule events, get reminders, and keep your day in focus." />
    <meta name="author" content="Essences" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Essences" />
    <meta property="og:description" content="A calm calendar for the plans that matter." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Essences" />
    <meta name="twitter:description" content="A calm calendar for the plans that matter." />
    <style>
      html, body {
        background: #fefefe;
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fefefe;
        transition: opacity 0.28s ease;
        pointer-events: none;
      }
      #boot-splash.boot-splash-hide {
        opacity: 0;
      }
      #boot-splash .boot-brand {
        display: flex;
        align-items: baseline;
        justify-content: center;
        gap: 0.4em;
        min-height: 1.6em;
        white-space: nowrap;
        padding: 0 20px;
      }
      #boot-splash .boot-crafted {
        margin: 0;
        font-family: Georgia, "Times New Roman", Times, serif;
        font-size: 22px;
        font-style: italic;
        font-weight: 400;
        color: #8a8a8a;
        letter-spacing: 0.02em;
      }
      #boot-splash .boot-confast {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 26px;
        font-weight: 600;
        color: var(--boot-accent, #ea863e);
        letter-spacing: -0.01em;
      }
    </style>
    <script>
      // Apply saved accent before first paint of "Confast" (no orange→other flash).
      (function () {
        var hex = {
          orange: "#EA863E",
          coral: "#EF5D39",
          amber: "#F2A60D",
          lime: "#67AE29",
          teal: "#259D91",
          sky: "#2095E9",
          violet: "#804BDD",
          rose: "#DF3A76",
        };
        var accent = hex.orange;
        try {
          var id = localStorage.getItem("essences-theme-accent");
          if (id && hex[id]) accent = hex[id];
        } catch (e) {}
        document.documentElement.style.setProperty("--boot-accent", accent);
      })();
    </script>
  </head>
  <body>
    <!-- Native launch = HQ icon only. Web splash = branding text only (avoids logo handoff blink). -->
    <div id="boot-splash" aria-hidden="true">
      <div class="boot-brand">
        <span class="boot-crafted" id="boot-crafted"></span>
        <span class="boot-confast" id="boot-confast"></span>
      </div>
    </div>
    <script>
      (function () {
        var crafted = "crafted by";
        var confast = "Confast";
        var craftedEl = document.getElementById("boot-crafted");
        var confastEl = document.getElementById("boot-confast");
        var started = false;
        var resolveReady;
        var resolveVisible;
        window.__bootSplashReady = new Promise(function (resolve) {
          resolveReady = resolve;
        });
        window.__bootSplashVisible = new Promise(function (resolve) {
          resolveVisible = resolve;
        });

        window.requestAnimationFrame(function () {
          window.requestAnimationFrame(function () {
            resolveVisible();
          });
        });

        function startTypewriter() {
          if (started) return;
          started = true;
          var i = 0;
          var phase = 0;
          var craftedMs = 85;
          var confastMs = 95;
          function tick() {
            if (phase === 0) {
              craftedEl.textContent = crafted.slice(0, i);
              i += 1;
              if (i > crafted.length) {
                phase = 1;
                i = 0;
                window.setTimeout(tick, 160);
                return;
              }
              window.setTimeout(tick, craftedMs);
              return;
            }
            confastEl.textContent = confast.slice(0, i);
            i += 1;
            if (i > confast.length) {
              resolveReady();
              return;
            }
            window.setTimeout(tick, confastMs);
          }
          tick();
        }

        window.__startBootTypewriter = startTypewriter;
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
