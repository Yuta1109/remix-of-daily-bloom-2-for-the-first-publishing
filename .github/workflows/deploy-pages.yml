name: Deploy GitHub Pages (privacy policy)

# Publishes docs/ (privacy-policy.html) to GitHub Pages.
# One-time setup required: Repo Settings → Pages → Source: GitHub Actions.
#
# To keep the App Store privacy URL working after this app repo is made
# Private (GitHub Free cannot host Pages from private repos), publish the
# separate public site from privacy-public-site/ (see that folder's README)
# and point App Store Connect to:
#   https://yuta1109.github.io/essences-privacy/privacy-policy.html
# Then you can disable Pages on this repository.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload docs site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
